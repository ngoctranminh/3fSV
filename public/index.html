<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý kho</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Quản lý kho</h1>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Tìm mục...">
    <button id="add-root" class="primary">+ Nhóm gốc</button>
    <button id="expand-all">Mở hết</button>
    <button id="collapse-all">Thu hết</button>
    <a href="api.html" class="api-link">Bảng thử API</a>
    <span id="current-user" class="current-user"></span>
    <button id="logout" type="button">Đăng xuất</button>
  </div>
  <div id="alerts" class="alerts"></div>
</header>

<main>
  <ul id="tree" class="tree"></ul>
  <p id="empty" class="empty" hidden>Chưa có mục nào. Chạy <code>npm run seed</code> hoặc bấm "+ Nhóm gốc".</p>
</main>

<dialog id="editor">
  <form method="dialog" id="editor-form">
    <h2 id="editor-title">Sửa mục</h2>
    <label>Tên<input name="name" required autocomplete="off"></label>
    <div class="row" id="stock-fields">
      <label>Số lượng<input name="quantity" type="number" step="any" min="0" value="0"></label>
      <label>Đơn vị<input name="unit" placeholder="gói, kg, hộp..." autocomplete="off"></label>
    </div>
    <label id="expiry-field">Hạn dùng<input name="expires_at" type="date"></label>
    <label>Ghi chú<textarea name="note" rows="2"></textarea></label>
    <div class="actions">
      <button value="cancel" formnovalidate>Huỷ</button>
      <button value="save" class="primary">Lưu</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
