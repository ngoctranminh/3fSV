<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · Quản lý kho</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<main class="login-shell">
  <form id="login-form" class="login-card">
    <h1>Đăng nhập</h1>
    <p>Quản lý kho</p>
    <label>Tài khoản<input name="username" required autocomplete="username" autofocus></label>
    <label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label>
    <p id="login-error" class="login-error" role="alert" hidden></p>
    <button class="primary" type="submit">Đăng nhập</button>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>
